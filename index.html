  <style>
    @font-face { font-family: Urbanist; src: url("assets/assets/fonts/Urbanist-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
    html, body { margin: 0; height: 100%; background: #141210; color: #EAE1D9; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; font-family: Urbanist, system-ui, sans-serif; transition: opacity .35s ease; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    #boot .blob { width: 64px; height: 64px; background: #E6A100; animation: morph 1.6s ease-in-out infinite, spin 2.4s linear infinite; }
    #boot .msg { font-size: 15px; font-weight: 600; letter-spacing: .02em; color: #D3C4B2; }
    #boot code { font-family: inherit; color: #FFB94F; }
    @keyframes morph {
      0%, 100% { border-radius: 42% 58% 60% 40% / 45% 45% 55% 55%; }
      33% { border-radius: 70% 30% 46% 54% / 30% 60% 40% 70%; }
      66% { border-radius: 30% 70% 70% 30% / 50% 30% 70% 50%; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot .blob { animation: none; border-radius: 50%; } }
    .fallback { max-width: 720px; margin: 0 auto; padding: 48px 20px; font-family: system-ui, sans-serif; line-height: 1.55; }
    .fallback a { color: #FFB94F; }
